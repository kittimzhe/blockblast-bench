[project]
name = "blockblast-bench"
version = "0.1.0"
description = "Block Blast game environment + AI-agent benchmark: evaluate spatial planning and long-horizon decision making of LLM agents by playing the block-puzzle game."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mengzhe" }]
keywords = ["benchmark", "llm", "agents", "evaluation", "puzzle", "block-blast", "game-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = []  # pure stdlib; zero-install runnable

[project.optional-dependencies]
dev = ["pytest>=7", "pillow"]
inspect = ["inspect-ai", "openai"]

[project.urls]
Homepage = "https://github.com/kittimzhe/blockblast-bench"
Issues = "https://github.com/kittimzhe/blockblast-bench/issues"

[project.scripts]
blockblast = "blockblast.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blockblast*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
